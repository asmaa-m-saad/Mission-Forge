  z-index: -1;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

#app {
  max-width: 1120px;
  margin: 0 auto;
  padding: 12px 16px 28px;
}

h1, h2, .h, .btn, .chip, .mf-badge {
  font-family: 'Press Start 2P', monospace;
}

.h {
  font-size: 12px;
  line-height: 1.75;
  color: var(--gold);
  margin: 6px 0;
  text-shadow: 2px 2px 0 #000;
}
h2.h { font-size: 13px; }

/* Mission Forge Holographic Neon Frame */
.w {
  background: var(--navy-card);
  backdrop-filter: blur(6px);
  border: 3px solid var(--cyan);
  border-radius: 14px;
  box-shadow:
    0 0 0 3px #000,
    0 0 24px rgba(110, 201, 232, 0.45),
    inset 0 0 18px rgba(122, 75, 168, 0.35);
  padding: 16px;
  margin: 12px 0;
  position: relative;
}
.w::before, .w::after {
  content: '';
  position: absolute;
  width: 44px;
  height: 4px;
  background: var(--gold);
  box-shadow: 0 0 8px var(--gold);
}
.w::before { top: -3px; left: 26px; }
.w::after { bottom: -3px; right: 26px; }

/* Buttons & Chips in Mission Forge Palette */
.btn, .chip {
  font-size: 11px;
  line-height: 1.5;
  background: linear-gradient(180deg, var(--purple) 0%, #522d78 100%);
  color: #fff;
  border: 2px solid var(--lavender);
  border-radius: 8px;
  padding: 12px 15px;
  min-height: 46px;
  cursor: pointer;
  box-shadow: 0 4px 0 #000, 0 0 12px rgba(213, 139, 232, 0.35);
  margin: 4px;
  transition: transform 0.12s, box-shadow 0.15s, background 0.15s;
}
.chip {
  font-size: 9px;
  padding: 10px 12px;
  background: var(--navy-sub);
  border-color: rgba(110, 201, 232, 0.45);
  min-height: 40px;
}
.chip.on {
  background: linear-gradient(180deg, var(--gold) 0%, #dca84e 100%);
  color: var(--navy);
  border-color: #fff;
  box-shadow: 0 3px 0 #000, 0 0 14px rgba(246, 212, 143, 0.7);
}
.chip.bg {
  font-size: 12px;
  padding: 18px 24px;
}
.btn:hover, .chip:hover {
  background: linear-gradient(180deg, var(--lavender) 0%, var(--purple) 100%);
  color: #fff;
  transform: translateY(-2px);
  box-shadow: 0 6px 0 #000, 0 0 18px rgba(213, 139, 232, 0.75);
}
.btn:active, .chip:active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
.btn:focus-visible, .chip:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

.go {
  background: linear-gradient(180deg, var(--lavender) 0%, var(--purple) 55%, #3a4f9e 100%);
  color: #fff;
  border: 3px solid #fff;
  text-shadow: 2px 2px 0 #000;
  animation: gl 1.4s infinite alternate;
}
.dg {
  background: linear-gradient(180deg, var(--danger) 0%, #a82040 100%);
  border-color: var(--gold);
  color: #fff;
}
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

@keyframes gl {
  to {
    box-shadow: 0 4px 0 #000, 0 0 24px var(--cyan), 0 0 12px var(--lavender);
  }
}

/* Aliuna Character & Dialogue Box */
.ab {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 10px 0;
}
.al-portrait {
  width: 112px;
  flex: none;
  filter: drop-shadow(0 0 12px rgba(110, 201, 232, 0.65));
  animation: bob 2.2s ease-in-out infinite;
}
.al-portrait img {
  width: 100%;
  height: auto;
  display: block;
}
.al-portrait.cel { animation: jp 0.55s infinite alternate; }
.al-portrait.wor { filter: drop-shadow(0 0 14px rgba(255, 107, 138, 0.85)); }

.bb {
  flex: 1;
  background: rgba(11, 28, 59, 0.92);
  color: #fff;
  border: 3px solid var(--cyan);
  border-radius: 12px;
  padding: 14px 18px;
  font-size: 25px;
  line-height: 1.35;
  position: relative;
  box-shadow: 0 0 16px rgba(110, 201, 232, 0.3), inset 0 0 12px rgba(122, 75, 168, 0.35);
}
.bb:before {
  content: '';
  position: absolute;
  left: -14px;
  top: 50%;
  transform: translateY(-50%);
  border: 10px solid transparent;
  border-right-color: var(--cyan);
  border-left: 0;
}
.bb .ali-name {
  display: inline-block;
  font-family: 'Press Start 2P', monospace;
  font-size: 9px;
  color: var(--gold);
  background: var(--purple);
  padding: 3px 8px;
  border-radius: 5px;
  margin-bottom: 6px;
  border: 1px solid var(--lavender);
}

@keyframes bob { 50% { transform: translateY(-6px); } }
@keyframes jp { to { transform: translateY(-14px); } }

/* Mission Forge Landing Screen (Screen 1) */
.mf-hero {
  min-height: 86vh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 8px 0 20px;
}
.mf-topbar {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 12px;
}
.mf-logo-wrap {
  text-align: left;
}
.mf-logo {
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(24px, 5vw, 46px);
  line-height: 1.15;
  margin: 0;
  background: linear-gradient(180deg, #ffffff 0%, var(--gold) 45%, var(--lavender) 75%, var(--cyan) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(3px 3px 0 #000) drop-shadow(0 0 16px rgba(213, 139, 232, 0.6));
}
.mf-sub {
  font-family: 'Press Start 2P', monospace;
  font-size: 10px;
  color: var(--cyan);
  margin-top: 6px;
  letter-spacing: 1px;
  text-shadow: 2px 2px 0 #000;
}
.mf-icon-btns {
  display: flex;
  gap: 10px;
}
.mf-icon-btn {
  width: 52px;
  height: 52px;
  border-radius: 12px;
  background: rgba(11, 28, 59, 0.88);
  border: 3px solid var(--cyan);
  box-shadow: 0 0 14px rgba(110, 201, 232, 0.5), 0 4px 0 #000;
  color: var(--gold);
  font-size: 22px;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: transform 0.15s, border-color 0.15s;
}
.mf-icon-btn:hover {
  transform: scale(1.08);
  border-color: var(--lavender);
}

/* Center Mission Forge Setup Panel */
.mf-panel {
  max-width: 620px;
  width: 100%;
  margin: 12px auto;
  background: rgba(11, 28, 59, 0.88);
  border: 3px solid var(--cyan);
  border-radius: 18px;
  padding: 22px 24px;
  box-shadow:
    0 0 0 3px #000,
    0 0 32px rgba(110, 201, 232, 0.55),
    inset 0 0 24px rgba(122, 75, 168, 0.45);
  position: relative;
}
.mf-panel::before, .mf-panel::after {
  content: '';
  position: absolute;
  width: 64px;
  height: 5px;
  background: var(--gold);
  border-radius: 3px;
  box-shadow: 0 0 10px var(--gold);
}
.mf-panel::before { top: -4px; left: 42px; }
.mf-panel::after { bottom: -4px; right: 42px; }

.mf-field-label {
  text-align: center;
  font-family: 'Press Start 2P', monospace;
  font-size: 11px;
  color: #fff;
  margin: 4px 0 12px;
  text-shadow: 2px 2px 0 #000;
}
.mf-field-label span { color: var(--gold); }

.mf-input-box {
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(7, 18, 40, 0.92);
  border: 2px solid var(--cyan);
  border-radius: 10px;
  padding: 10px 14px;
  box-shadow: inset 0 0 10px rgba(110, 201, 232, 0.25);
  margin-bottom: 18px;
}
.mf-input-box input {
  flex: 1;
  background: transparent;
  border: 0;
  outline: none;
  color: var(--gold);
  font: 26px 'VT323', monospace;
}
.mf-input-box input::placeholder { color: rgba(110, 201, 232, 0.55); }

.mf-mode-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 16px;
}
.mf-mode-card {
  background: rgba(16, 38, 78, 0.85);
  border: 3px solid rgba(110, 201, 232, 0.45);
  border-radius: 12px;
  padding: 14px 10px;
  text-align: center;
  cursor: pointer;
  color: #fff;
  font-family: 'Press Start 2P', monospace;
  font-size: 11px;
  transition: all 0.18s;
}
.mf-mode-card.on {
  border-color: var(--lavender);
  background: linear-gradient(180deg, rgba(122, 75, 168, 0.55) 0%, rgba(11, 28, 59, 0.95) 100%);
  box-shadow: 0 0 20px rgba(213, 139, 232, 0.65), inset 0 0 12px rgba(246, 212, 143, 0.25);
}
.mf-mode-card .icon {
  font-size: 32px;
  display: block;
  margin-bottom: 8px;
}
.mf-play-btn {
  display: block;
  width: 240px;
  max-width: 100%;
  margin: 14px auto 0;
  padding: 16px 20px;
  font-family: 'Press Start 2P', monospace;
  font-size: 16px;
  color: #fff;
  background: linear-gradient(180deg, var(--lavender) 0%, var(--purple) 52%, #2c679e 100%);
  border: 3px solid #fff;
  border-radius: 12px;
  box-shadow: 0 5px 0 #000, 0 0 24px rgba(110, 201, 232, 0.75);
  cursor: pointer;
  text-shadow: 2px 2px 0 #000;
  transition: transform 0.15s;
}
.mf-play-btn:hover { transform: scale(1.04); }

/* Screen 2: Aliuna Briefing Stage (Matches User's Exact Prompt & Reference) */
.briefing-stage {
  min-height: 82vh;
  display: grid;
  grid-template-columns: minmax(220px, 310px) 1fr;
  align-items: center;
  gap: 24px;
  padding: 16px 8px;
}
@media (max-width: 760px) {
  .briefing-stage {
    grid-template-columns: 1fr;
    text-align: center;
  }
  .briefing-aliuna {
    max-width: 210px;
    margin: 0 auto;
  }
}
.briefing-aliuna {
  position: relative;
  animation: bob 2.4s ease-in-out infinite;
  filter: drop-shadow(0 0 22px rgba(110, 201, 232, 0.75));
}
.briefing-aliuna img {
  width: 100%;
  height: auto;
  display: block;
}
.briefing-box {
  background: rgba(11, 28, 59, 0.88);
  backdrop-filter: blur(8px);
  border: 4px solid var(--cyan);
  border-radius: 20px;
  padding: 32px 28px 26px;
  box-shadow:
    0 0 0 4px #000,
    0 0 36px rgba(110, 201, 232, 0.65),
    inset 0 0 28px rgba(122, 75, 168, 0.45);
  position: relative;
}
.briefing-box::before, .briefing-box::after {
  content: '';
  position: absolute;
  width: 76px;
  height: 5px;
  background: var(--gold);
  border-radius: 3px;
  box-shadow: 0 0 10px var(--gold);
}
.briefing-box::before { top: -4px; left: 44px; }
.briefing-box::after { bottom: -4px; right: 44px; }

.briefing-line1 {
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(13px, 2vw, 17px);
  line-height: 1.85;
  color: #fff;
  margin: 0 0 24px;
  text-shadow: 2px 2px 0 #000;
}
.briefing-line1 .hl-name {
  color: var(--gold);
}
.briefing-line2 {
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(14px, 2.2vw, 19px);
  line-height: 1.85;
  color: var(--gold);
  margin: 0 0 24px;
  text-shadow: 2px 2px 0 #000;
}
.briefing-next-row {
  display: flex;
  justify-content: flex-end;
}

/* Grids, Meters, Ship & Gameplay */
.g3 { display: grid; grid-template-columns: 1fr 1.1fr 1fr; gap: 12px; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 860px) { .g3, .g2 { grid-template-columns: 1fr; } .hg { order: -1; } }

.ml { display: flex; justify-content: space-between; gap: 6px; }
.mb { height: 13px; background: var(--navy-deep); border: 2px solid #000; border-radius: 4px; margin: 3px 0 9px; overflow: hidden; }
.mb i { display: block; height: 100%; background: var(--ok); transition: width 0.4s; }
.mb i.w { background: var(--gold); }
.mb i.b { background: var(--danger); }
b.b, .bad { color: var(--danger); }
b.w { color: var(--gold); }
.ok { color: var(--ok); }

.pop { animation: pp 0.7s; }
@keyframes pp { from { transform: translateY(-40px); opacity: 0; } }
.fl { transform-box: fill-box; transform-origin: top; animation: fk 0.15s infinite alternate; }
@keyframes fk { to { transform: scaleY(1.4); } }

#ship { width: 100%; max-height: 320px; filter: drop-shadow(0 0 10px rgba(110, 201, 232, 0.35)); }
.fx { min-height: 30px; color: var(--cyan); }
.mu { color: #a7c0ec; }
.ck { padding: 6px 0; animation: ci 0.4s both; }
.ck small { display: block; color: #a7c0ec; }
@keyframes ci { from { opacity: 0; transform: translateX(-20px); } }

.kp { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin: 10px 0; }
.kp div { background: var(--navy-sub); padding: 8px; border: 2px solid var(--cyan); border-radius: 8px; }
.kp b { display: block; color: var(--gold); }

.tb { width: 100%; border-collapse: collapse; }
.tb td, .tb th { border: 2px solid rgba(110, 201, 232, 0.35); padding: 6px 8px; text-align: left; }

.ctr { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
.ch { background: var(--navy-sub); border-left: 4px solid var(--gold); padding: 8px 12px; margin: 8px 0; border-radius: 6px; }
.ov { position: fixed; inset: 0; background: rgba(7, 18, 40, 0.86); backdrop-filter: blur(4px); display: grid; place-items: center; z-index: 9; padding: 14px; }
.hud {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
  background: rgba(11, 28, 59, 0.85);
  border: 2px solid var(--cyan);
  border-radius: 10px;
  padding: 8px 14px;
  margin-top: 4px;
}

.pc { image-rendering: pixelated; width: 82px; height: 82px; }
.pb {
  background: rgba(16, 38, 78, 0.55);
  border: 2px solid transparent;
  border-radius: 12px;
  color: #fff;
  font: inherit;
  cursor: pointer;
  padding: 10px 8px;
  filter: brightness(0.65);
  transition: transform 0.35s, filter 0.35s, border-color 0.35s;
  display: flex;
  flex-direction: column;
  align-items: center;
  max-width: 145px;
  text-align: center;
}
.pb.sel {
  transform: scale(1.18);
  filter: none;
  margin: 0 12px;
  border-color: var(--gold);
  background: rgba(122, 75, 168, 0.45);
  box-shadow: 0 0 18px rgba(246, 212, 143, 0.55);
}
.pb:focus-visible { outline: 3px solid var(--gold); }

.roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
.rc { background: var(--navy-sub); border: 2px solid var(--cyan); border-radius: 8px; padding: 8px; }
.rc span { color: var(--gold); }

.orb { position: relative; width: 140px; height: 140px; margin: auto; }
.orb .pc { width: 140px; height: 140px; }
.orb i { position: absolute; left: 65px; top: 65px; width: 10px; height: 10px; background: var(--gold); border-radius: 50%; animation: ob 3s linear infinite; }
@keyframes ob { from { transform: rotate(0) translateX(90px); } to { transform: rotate(360deg) translateX(90px); } }

.jy { position: relative; height: 150px; overflow: hidden; }
.sh { position: absolute; top: 36px; width: 70px; transition: left 1s; }
.sh svg { transform: rotate(90deg); }
.pn { position: absolute; right: 4%; top: 10px; transition: transform 1s; }
.pn .pc { width: 110px; height: 110px; }
.ch2 { display: block; width: 100%; text-align: left; margin: 6px 0; }

.ls { position: relative; height: 88vh; overflow: hidden; background: linear-gradient(var(--cyan), var(--lavender) 65%, var(--purple)); transition: background 1.5s; border: 4px solid var(--cyan); border-radius: 14px; }
.ls.sp { background: var(--navy-deep); }
.rkt3 { position: absolute; left: 50%; bottom: 90px; width: 90px; margin-left: -45px; }
.ign .rkt3 { animation: sh 0.08s infinite; }
.lift .rkt3 { animation: none; transform: translateY(-110vh); transition: transform 2.8s cubic-bezier(0.5, 0, 1, 1); }
@keyframes sh { 50% { transform: translate(3px, 2px); } }
.sm { position: absolute; bottom: -20px; left: 20px; width: 30px; height: 30px; background: #fff; opacity: 0; }
.s2 { left: 50px; } .s3 { left: -10px; }
.ign .sm { animation: sm 1.2s infinite; }
@keyframes sm { from { opacity: 0.9; } to { opacity: 0; transform: translateY(60px) scale(3); } }
.pad { position: absolute; bottom: 0; left: 0; right: 0; height: 90px; background: #1e2d56; border-top: 6px solid var(--gold); }
.cd { position: absolute; top: 12%; width: 100%; text-align: center; font: 36px 'Press Start 2P', monospace; color: var(--gold); text-shadow: 4px 4px #000; }
.sk { position: absolute; right: 12px; top: 12px; }

input[type="range"] { accent-color: var(--gold); cursor: pointer; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

function rs() {
  W = cv.width = innerWidth; H = cv.height = innerHeight;
  stars = Array.from({ length: 95 }, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    s: (Math.random() * 2 | 0) * 2 + 2,

function dp() {
  document.querySelectorAll('canvas[data-p]').forEach(c => {
    const z = c.width, x = c.getContext('2d'), k = c.dataset.p, C = PC[k], R = z / 2 - 1, sd = k.charCodeAt(1);
    for (let i = 0; i < z; i++) for (let j = 0; j < z; j++) {
      const dx = i - z / 2, dy = j - z / 2, a = Math.atan2(dy, dx), rr = k == 'as' ? R * (0.78 + 0.22 * Math.sin(a * 3 + sd)) : R;
      if (Math.hypot(dx, dy) > rr) continue;
      const n = Math.abs(Math.sin(i * 12.9898 + j * 78.233 + sd) * 43758.5453) % 1, l = (-dx - dy) / R * 0.5 + n * 0.5 + 0.1;

<script>/* ===== MISSION FORGE ADD-ONS: name, cheat sheet, ALIUNA assistance ===== */

 if(s=='fly'&&st.m){const i=st.ev,e=EV(st.m)[i];if(!e)return['Mission nearly complete!','happy'];if(st.res)return['Decision made. Press CONTINUE when you are ready.','idle'];

 if(['build','ctrl','ready'].includes(s)){const mm=M(),c=checks(mm),i=c.findIndex(x=>!x[1]);

 return['Pick a destination, then build a ship that can reach it. Open the Cheat Sheet if a word is new!','happy']}
